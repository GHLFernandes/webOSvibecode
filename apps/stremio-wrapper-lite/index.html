<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, height=720, user-scalable=no">
  <title>Stremio</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0226;
      color: #fff;
      font-family: sans-serif;
      font-size: 28px;
      text-align: center;
      padding: 48px;
      z-index: 2;
    }
    #splash.hidden { display: none; }
    #stremio-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="splash">
    <p>Stremio</p>
    <p style="font-size: 22px; opacity: 0.85;">OK para carregar (libera memória antes)</p>
  </div>
  <iframe
    id="stremio-frame"
    src="about:blank"
    data-src="https://tv.strem.io"
    tabindex="-1"
    allow="autoplay; fullscreen; encrypted-media"
    allowfullscreen>
  </iframe>
  <script src="main.js"></script>
</body>
</html>
